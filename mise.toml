[env]
IOS_DEVICE_ID = "00008150-001474443AE0C01C"
IOS_BUNDLE_ID = "com.gonewx.mindra.app"
# 编译机 SSH 别名，见 scripts/ios_sync.sh
MINDRA_VM_HOST = "imacvm-tahoe"

[tasks."ios:devices"]
description = "List connected physical iOS devices and simulators"
run = "flutter devices"

[tasks."ios:open"]
description = "Open the iOS workspace in Xcode"
run = "open ios/Runner.xcworkspace"

[tasks."ios:sim:build"]
description = "Build a Debug app for the iOS simulator"
run = "flutter build ios --simulator --debug"

[tasks."ios:sim:install"]
description = "Build, install, and launch the app on the booted simulator"
run = '''
flutter build ios --simulator --debug
xcrun simctl terminate booted "$IOS_BUNDLE_ID" 2>/dev/null || true
xcrun simctl install booted build/ios/iphonesimulator/Runner.app
xcrun simctl launch booted "$IOS_BUNDLE_ID"
'''

[tasks."ios:run:debug"]
description = "Run Debug on the configured physical iPhone（先解锁签名 keychain，避免 errSecInternalComponent）"
run = '''
./scripts/ios_signing_import.sh --unlock
flutter run -d "$IOS_DEVICE_ID"
'''

[tasks."ios:run:release"]
description = "Install and run Release on the configured physical iPhone（先解锁签名 keychain）"
run = '''
./scripts/ios_signing_import.sh --unlock
flutter run --release -d "$IOS_DEVICE_ID"
'''

[tasks."ios:ipa:build"]
description = "Build a signed Release IPA"
run = "flutter build ipa --release"

# ---------------------------------------------------------------------------
# iOS 发布链路（宿主 Linux + 离线 Mac VM + appuploader 上传）
#
# 完整流程（账号下来后第一次）：
#   1. appuploader（GUI）里创建证书 + profile，导出 .p12 / .mobileprovision
#   2. mise run ios:vm:signing:import -- -c <p12> -p <profile>  装进编译机
#   3. mise run ios:vm:archive                                    编译签名出 IPA
#   4. mise run ios:sync:back                                      IPA 回宿主
#   5. appuploader 里选 build/ios/ipa/ 下的 IPA 上传 TestFlight
#
# 日常迭代：ios:build:bump → ios:vm:archive → ios:sync:back → appuploader
# ---------------------------------------------------------------------------

[tasks."ios:signing:status"]
description = "（编译机上）查看证书/profile/Signing.xcconfig 状态"
run = "./scripts/ios_signing_import.sh --status"

[tasks."ios:signing:import"]
description = "（编译机上）导入 .p12 与 .mobileprovision 并写 Signing.xcconfig"
run = "./scripts/ios_signing_import.sh"

[tasks."ios:signing:reset"]
description = "（编译机上）清空专用 keychain 与已装 profile"
run = "./scripts/ios_signing_import.sh --reset"

[tasks."ios:build:bump"]
description = "iOS build number +1（只改 ios/build_number.txt，不影响已产出的 IPA；先 bump 再 archive，新包才带新号）"
run = '''
n=$(cat ios/build_number.txt)
echo $((n + 1)) > ios/build_number.txt
echo "build number: $n -> $((n + 1))"
echo "提示: 仅对下一次 ios:vm:archive 生成的新包生效；已产出 IPA 内的 build number 不变，上传 TestFlight 以 IPA 打包时固化值为准"
'''

[tasks."ios:archive"]
description = "（编译机上）构建签名 IPA 到 build/ios/ipa/"
run = "./scripts/ios_archive.sh"

[tasks."ios:sync:push"]
description = "（宿主）代码同步到 Mac 编译机"
run = "./scripts/ios_sync.sh push"

[tasks."ios:sync:back"]
description = "（宿主）从编译机回收 IPA 到 build/ios/ipa/"
run = "./scripts/ios_sync.sh pull"

[tasks."ios:sync:status"]
description = "（宿主）查看编译机环境状态"
run = "./scripts/ios_sync.sh status"

[tasks."ios:vm:signing:status"]
description = "（宿主）远程查看编译机签名资产状态"
run = "./scripts/ios_sync.sh status"

[tasks."ios:vm:signing:import"]
description = "（宿主）递送 .p12/.mobileprovision 到编译机并导入（参数原样透传）"
run = "./scripts/ios_sync.sh cert"

[tasks."ios:vm:signing:unlock"]
description = "（宿主）解锁编译机签名 keychain（含 GUI session），修 Xcode 弹密码框"
run = "./scripts/ios_sync.sh unlock"

[tasks."ios:vm:archive"]
description = "（宿主）先同步代码，再远程在编译机上构建 IPA"
run = '''
./scripts/ios_sync.sh push
ssh "$MINDRA_VM_HOST" "cd mindra && mise exec -- ./scripts/ios_archive.sh"
'''

[tasks."ios:vm:archive:adhoc"]
description = "（宿主）同步代码并远程构建 AdHoc 签名 IPA（mindra-adhoc.ipa，可装真机独立运行；勿传 TestFlight）"
run = '''
./scripts/ios_sync.sh push
ssh "$MINDRA_VM_HOST" "cd mindra && mise exec -- ./scripts/ios_archive.sh --distribution ad-hoc"
'''

[tasks."ios:ipa:install"]
description = "按名称安装 IPA 到真机。默认 mindra-adhoc.ipa（真机独立版）；--appstore 装 mindra.ipa；或用 IPA_PATH= 精确指定文件"
run = '''
ipa_path="${IPA_PATH:-}"
name="${IPA_NAME:-mindra-adhoc.ipa}"

if [ -z "$ipa_path" ]; then
  if [ "${1:-}" = "--appstore" ]; then
    name="mindra.ipa"
  fi
  ipa_path=$(find build/ios/ipa "$HOME/Documents" -maxdepth 1 -type f -name "$name" -print 2>/dev/null | head -n 1)
fi

if [ -z "$ipa_path" ] || [ ! -f "$ipa_path" ]; then
  echo "未找到要安装的 IPA（期望：$name；或 IPA_PATH= 指定文件）。先构建: mise run ios:vm:archive:adhoc" >&2
  exit 1
fi

echo "Installing: $ipa_path"
xcrun devicectl device install app --device "$IOS_DEVICE_ID" "$ipa_path"
'''

[tasks."ios:launch"]
description = "Launch the installed app on the configured iPhone"
run = "xcrun devicectl device process launch --device \"$IOS_DEVICE_ID\" \"$IOS_BUNDLE_ID\""

[tasks."ios:sim:screenshot"]
description = "Save a simulator screenshot; override SIM_SCREENSHOT_PATH if needed"
run = '''
output_path="${SIM_SCREENSHOT_PATH:-/tmp/mindra-simulator.png}"
xcrun simctl io booted screenshot "$output_path"
echo "Saved: $output_path"
'''
